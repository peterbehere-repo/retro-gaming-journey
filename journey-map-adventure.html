<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a3a4a"/>

<title>Journey Map 4 - NES Adventure</title>
<style>
:root { --gold:#ffcc4d; --accent:#54f2b8; --ink:#0c0f1d; --muted:#8b93c4; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--ink); color:#e6e9ff; font-family:"Courier New",monospace; height:100vh; overflow:hidden; }
h1 { font-size:1.25rem; margin-bottom:.15rem; }
.sub { color:var(--muted); font-size:.75rem; margin-bottom:.7rem; }
.legend { display:flex; gap:1.1rem; font-size:.68rem; color:var(--muted); margin-bottom:.7rem; flex-wrap:wrap; align-items:center; }
.legend b { color:var(--gold); }
.jm-legend { position:absolute; bottom:10px; left:12px; z-index:6; display:flex; gap:1rem; flex-wrap:wrap;
             font-size:.66rem; color:#cfd6ff; background:#0c0f1de6; border:1px solid #252b52;
             border-radius:8px; padding:.35rem .7rem; pointer-events:none; }
.map-wrap { position:absolute; inset:0; overflow:hidden; background:#2ca7b1; cursor:grab; }
/* When the frame is wider than 16:9 the map sits centred at fit scale and its own ocean has to carry
   on into the side bands. The same artwork, stretched to the frame, is laid behind the map so the
   bands continue the sea instead of showing a flat colour or a hard edge. */

.map-wrap.dragging { cursor:grabbing; }
.map-inner { position:relative; z-index:2; width:1280px; height:720px; transform-origin:0 0; will-change:transform; }
.zoombar { position:absolute; top:10px; right:10px; z-index:7; display:flex; gap:6px; }
.zoombar button, .zoombar select { background:#141831ee; color:var(--gold); border:1.5px solid var(--gold); border-radius:8px;
                  font:inherit; font-size:.8rem; padding:.3rem .65rem; cursor:pointer; }
.zoombar button:hover, .zoombar select:hover { background:#1c2250; }

/* custom chevron so the pt-jump dropdown matches the +/- and fit buttons */
.zoombar select { background:#141831ee url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="%23ffcc4d"/></svg>') no-repeat right .5rem center;
                  background-size:.6rem; padding:.3rem 1.6rem .3rem .65rem;
                  appearance:none; -webkit-appearance:none; -moz-appearance:none; }
.zoombar select:focus-visible { outline:2px solid #ffe28a; outline-offset:1px; }
.zoombar select option { background:#141831; color:#ffcc4d; }
.zoomlabel { position:absolute; bottom:10px; right:12px; z-index:5; font-size:.68rem; color:var(--muted);
             background:#0c0f1dcc; border-radius:6px; padding:.2rem .5rem; }
.map-inner img.world { position:absolute; inset:0; width:1280px; height:720px; image-rendering:auto; }
svg.overlay { position:absolute; inset:0; width:1280px; height:720px; }
.trail-case { fill:none; stroke:#0c0f1d; stroke-width:9; opacity:.35; stroke-linecap:round; stroke-linejoin:round; }
.trail { fill:none; stroke:var(--gold); stroke-width:3.5; stroke-dasharray:11 8; opacity:.95; stroke-linecap:round;
         stroke-linejoin:round; filter:drop-shadow(0 0 4px rgba(255,204,77,.65)); animation:march 1.6s linear infinite; }
@keyframes march { to { stroke-dashoffset:-19; } }
.pnode { cursor:pointer; }
.pnode .hit { fill:transparent; }
.pnode .ph { fill:#101430cc; stroke:var(--gold); stroke-width:1.5; r:5px;
             transition:r .15s ease, stroke-width .15s ease, fill .15s ease, stroke .15s ease; }
.pnode:hover .ph { fill:#1c2250dd; stroke:#ffe28a; stroke-width:2.5; r:15px;
                   filter:drop-shadow(0 0 5px rgba(255,204,77,.45)); }
.pnode .pnum { fill:var(--gold); font-weight:bold; font-size:13px; text-anchor:middle; font-family:"Courier New",monospace;
               opacity:0; pointer-events:none; transition:opacity .15s ease; }
.pnode:hover .pnum { opacity:1; }
.done .ph { stroke:var(--accent); }
.done:hover .ph { stroke:#9dffdc; filter:drop-shadow(0 0 5px rgba(84,242,184,.55)); }
.done .pnum { fill:var(--accent); }
.badge { fill:#0c0f1dee; stroke:var(--gold); }
.startflag { font-size:9px; fill:var(--gold); font-family:"Courier New",monospace; letter-spacing:.12em; opacity:.85; }

#pop { position:fixed; inset:0; display:none; background:rgba(5,7,15,.78); z-index:20; align-items:center; justify-content:center; }
#pop.open { display:flex; }
.pop-card { background:#141831; border:2px solid var(--gold); border-radius:16px; padding:1.1rem 1.3rem;
            text-align:center; width:640px; max-width:calc(100vw - 1.4rem); max-height:calc(100vh - 1.4rem);
            overflow-y:auto; box-shadow:0 10px 60px rgba(0,0,0,.8); cursor:default; }
.pc-body { display:flex; gap:1.15rem; align-items:center; }
.pc-art { flex:0 0 auto; }
.pc-info { flex:1 1 auto; min-width:0; text-align:center; }
.pc-info .pname { font-size:1.15rem; }
.pop-card img { display:block; margin:0 auto; width:auto; height:auto; max-width:100%; max-height:min(232px, calc(100vh - 7.5rem)); border:0; border-radius:0; background:none; object-fit:contain; filter:drop-shadow(0 10px 22px rgba(0,0,0,.6)); }
.pop-card .pname { font-size:1.05rem; font-weight:bold; margin:.6rem 0 .1rem; }
.pop-card .pnum { color:var(--muted); font-size:.72rem; margin-bottom:.6rem; }
.pop-card .bigstars { font-size:1.7rem; letter-spacing:.5rem; margin:.3rem 0 .6rem; color:var(--gold); }
.pop-card .tier { text-align:left; font-size:.75rem; padding:.35rem .5rem; border-radius:8px; margin:.25rem 0; background:#101430; }
.pop-card .tier.earned { border:1px solid var(--gold); }
.pop-card .tier.locked { border:1px solid #2a3057; color:var(--muted); }
.pop-card .tier b { color:var(--gold); }
.pop-card .tier-desc { color:#9aa3cc; font-size:.68rem; margin-top:.2rem; line-height:1.35; }
.pop-card .hint { margin-top:.7rem; font-size:.68rem; color:var(--muted); }
@media (max-width:560px){ .pop-card{width:min(94vw,420px);} .pc-body{flex-direction:column;align-items:center;gap:.6rem;} .pc-info{width:100%;} }

/* sprites are pixel art: never let the browser smooth them */
image.sprite { image-rendering: pixelated; }

/* ---------------- mobile / touch ---------------- */
html, body { height:100%; height:100dvh; overscroll-behavior:none; }
body { -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
/* the map handles every gesture itself: no page scroll, no browser pinch-zoom */
.map-wrap { touch-action:none; -webkit-user-select:none; user-select:none; }
#pop { padding:10px; }
@media (max-width:760px) {
  .zoombar { top:8px; right:8px; left:8px; justify-content:flex-end; flex-wrap:wrap; gap:5px; }
  .zoombar button { min-width:44px; min-height:44px; font-size:1rem; padding:0 .55rem; }
  .zoombar select { min-height:44px; font-size:.8rem; max-width:52vw; }
  .jm-legend { left:8px; right:auto; bottom:8px; max-width:calc(100% - 74px);
               gap:.2rem .65rem; padding:.35rem .5rem; font-size:.58rem; line-height:1.35; }
  .zoomlabel { bottom:8px; right:8px; font-size:.62rem; }
  .pop-card { width:min(94vw,420px); max-height:88dvh; overflow:auto; -webkit-overflow-scrolling:touch; }
  .pop-card .hint { font-size:.72rem; }
}
@media (max-width:400px) { .jm-legend span:nth-child(2) { display:none; } }
@media (max-height:430px) { .jm-legend { display:none; } }
</style></head><body>
<div class="map-wrap" id="viewport"><div class="jm-legend">
  <span>&#9679; gold ring = fully completed</span>
  <span>&#9733;&#9733;&#9733; Beginner / Intermediate / Advanced</span>
  <span>drag to pan &middot; scroll to zoom</span>
</div>
<div class="zoombar">
  <button id="zin" title="zoom in">+</button><button id="zout" title="zoom out">&minus;</button>
  <select id="ptsel" title="jump to a path point"></select>
</div><div class="zoomlabel" id="zl"></div><div class="map-inner" id="inner">
  <img class="world" id="world" alt="worldmap"/>
  <svg class="overlay" viewBox="0 0 1280 720" id="ov"></svg>
</div></div></div>
<div id="pop"><div class="pop-card" id="popcard"></div></div>

/* Achievement wording straight from RetroAchievements: one entry per map point,
   in easy / intermediate / advanced order, so each star names the real set pick
   instead of generic tier prose. Keys are normT(game name); missing key = fall
   back to TIER_DESC. */

/* ---- whose stars are these? ------------------------------------------------
   The Achievements tab (same origin, one page) caches the three RetroAchievements
   picks per game, and — for the account that is signed in — which of them are
   earned. This map reads that per-account cache and nothing else: with no session
   the cache does not exist and every point draws bare. The "stars" values sitting
   in DATA are seeded to 0 and are overwritten on every draw, so a map can never
   show progress that nobody earned. */
/* ---- sprites beside a point ----
   One gif per star, in the same Beginner -> Intermediate -> Advanced order the
   card lists, so what you see on the map is the pick you just earned. Add a
   game by giving its normalised title an array of sprites; the nth star paints
   the nth one. Offsets are map units, [dx, dy, w, h], relative to the point. */

function spriteMarkup(g, got){
  const set = SPRITES[normT(g.name)];
  if(!set || got < 1) return "";
  return set.slice(0, got).map(s=>`<image class="sprite" x="${g.x+s.dx}" y="${g.y+s.dy}" width="${s.w}" height="${s.h}" href="${s.href}"/>`).join("");
}
function sessionUser(){
  try{ const s=JSON.parse(localStorage.getItem("rgj-session-v1")||"null");
       return s&&s.user?String(s.user).toLowerCase():""; }catch(e){ return ""; }
}
function normT(s){return String(s||"").toLowerCase()
  .replace(/\([^)]*\)|\[[^\]]*\]/g," ").replace(/&/g," and ")
  .replace(/[^a-z0-9]+/g," ").replace(/\b(the|a|an)\b/g," ").replace(/\s+/g," ").trim();}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function achStore(k){try{return JSON.parse(localStorage.getItem(k)||"{}")}catch(e){return {}}}
function starsFor(name){
  const who = sessionUser();
  if(!who) return 0;                                   // signed out: nothing is earned
  const c = achStore("rgj-ach-v1")["nes|"+normT(name)];
  if(!c||!c.picks||!c.picks.length) return 0;
  const e = achStore("rgj-ach-earned-v1:u:"+who)[c.raId]||{};
  return c.picks.filter(p=>e[p.id]).length;
}
function syncStars(){ DATA.games.forEach(g=>{ g.stars = starsFor(g.name); }); }

document.getElementById("world").src = DATA.world;
const ov=document.getElementById("ov");
const R=31;
const pts = DATA.games.map(g=>[g.x,g.y]);
function roundedPath(pts,r){
  // straight runs with rounded corners: keeps the serpentine rigid and tidy
  r = r || 46;
  let d=`M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1],p1=pts[i],p2=pts[i+1];
    const v1=[p1[0]-p0[0],p1[1]-p0[1]], v2=[p2[0]-p1[0],p2[1]-p1[1]];
    const l1=Math.hypot(...v1), l2=Math.hypot(...v2);
    const rr=Math.min(r,l1/2,l2/2);
    const a=[p1[0]-v1[0]/l1*rr, p1[1]-v1[1]/l1*rr];
    const b=[p1[0]+v2[0]/l2*rr, p1[1]+v2[1]/l2*rr];
    d+=` L ${a[0].toFixed(1)} ${a[1].toFixed(1)} Q ${p1[0]} ${p1[1]} ${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
  }
  d+=` L ${pts[pts.length-1][0]} ${pts[pts.length-1][1]}`;
  return d;
}
const pathD = roundedPath(pts);
function drawNodes(){
  syncStars();
  ov.innerHTML = `<path class="trail-case" d="${pathD}"/><path class="trail" d="${pathD}"/>`;
  DATA.games.forEach((g,i)=>{
    const done = g.stars===3;
    ov.insertAdjacentHTML('beforeend', `<g class="pnode ${done?'done':''}" data-i="${i}">
      <circle class="hit" cx="${g.x}" cy="${g.y}" r="16"/>
      <circle class="ph" cx="${g.x}" cy="${g.y}" r="5"/>
      <text class="pnum" x="${g.x}" y="${g.y+4.5}">${i+1}</text>
      ${spriteMarkup(g, g.stars)}
      ${i===0?`<text class="startflag" x="${g.x-14}" y="${g.y-14}">START</text>`:''}
    </g>`);
  });
  wireNodes();
}
function wireNodes(){
document.querySelectorAll(".pnode").forEach(el=>{

      <div class="bigstars">${TIERS.map((t,k)=>k<g.stars?"&#9733;":"&#9734;").join("")}</div>
      ${(PICK_TEXT[normT(g.name)]||[]).length

});

const vp = document.getElementById("viewport"), inner = document.getElementById("inner"), zl = document.getElementById("zl");
const MAPW = 1280, MAPH = 720, MAXS = 7;
let scale = 1, tx = 0, ty = 0;
function clampT() {
  tx = Math.min(0, Math.max(vp.clientWidth  - MAPW * scale, tx));
  ty = Math.min(0, Math.max(vp.clientHeight - MAPH * scale, ty));
  if (MAPW * scale < vp.clientWidth)  tx = (vp.clientWidth  - MAPW * scale) / 2;
  if (MAPH * scale < vp.clientHeight) ty = (vp.clientHeight - MAPH * scale) / 2;
}
function apply() { clampT(); inner.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  zl.textContent = Math.round(scale * 10) / 10 + "x"; }
function zoomAt(mx, my, s2) {
  const ns = Math.max(minScale(), Math.min(MAXS, s2));
  const wx = (mx - tx) / scale, wy = (my - ty) / scale;
  scale = ns; tx = mx - wx * scale; ty = my - wy * scale; apply();
}
function centerOn(x, y, s) {
  scale = Math.min(MAXS, s);
  tx = vp.clientWidth / 2 - x * scale; ty = vp.clientHeight / 2 - y * scale; apply();
}
function fit() { scale = Math.min(vp.clientWidth / MAPW, vp.clientHeight / MAPH);
  tx = (vp.clientWidth - MAPW * scale) / 2; ty = (vp.clientHeight - MAPH * scale) / 2; apply(); }
// ---------- fly-to: pan/zoom to a point instead of cutting to it ----------
let flyRaf = null;
function cancelFly() { if (flyRaf !== null) { cancelAnimationFrame(flyRaf); flyRaf = null; } }
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function fitScale() { return Math.min(vp.clientWidth / MAPW, vp.clientHeight / MAPH); }
function flyTo(x, y, s, dur) {
  cancelFly();
  const S = Math.min(MAXS, s);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { centerOn(x, y, S); return; }
  const cx0 = (vp.clientWidth / 2 - tx) / scale, cy0 = (vp.clientHeight / 2 - ty) / scale;
  const d = Math.hypot(x - cx0, y - cy0);
  const w0 = vp.clientWidth / scale, w1 = vp.clientWidth / S;
  const wPeak = Math.max(w0, w1, d * 1.15);
  const sPeak = Math.max(fitScale(), Math.min(scale, S, vp.clientWidth / wPeak));
  const dip = Math.max(0, Math.log(Math.min(scale, S) / sPeak));
  dur = dur || Math.min(950, Math.max(480, 480 + 300 * Math.min(1, d / w1)));
  const l0 = Math.log(scale), l1 = Math.log(S), t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / dur), e = easeInOut(t);
    scale = Math.exp(l0 + (l1 - l0) * e - dip * Math.sin(Math.PI * e));
    const cx = cx0 + (x - cx0) * e, cy = cy0 + (y - cy0) * e;
    tx = vp.clientWidth / 2 - cx * scale; ty = vp.clientHeight / 2 - cy * scale;
    apply();
    if (t < 1) flyRaf = requestAnimationFrame(step);
    else { flyRaf = null; centerOn(x, y, S); }
  };
  flyRaf = requestAnimationFrame(step);
}

}, { passive: false });
let drag = null, moved = 0;
vp.addEventListener("mousedown", e => { markTouched(); detachPt(); cancelFly(); drag = { x: e.clientX, y: e.clientY, tx, ty }; moved = 0; vp.classList.add("dragging"); });
window.addEventListener("mousemove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
  tx = drag.tx + dx; ty = drag.ty + dy; apply();
});
window.addEventListener("mouseup", () => { drag = null; vp.classList.remove("dragging"); });
document.getElementById("zin").onclick = () => { markTouched(); detachPt(); cancelFly(); zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, scale * 1.4); };
document.getElementById("zout").onclick = () => { markTouched(); detachPt(); cancelFly(); zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, scale / 1.4); };
const PT_ZOOM = 2.4;   // template zoom used for every path point
const ptsel = document.getElementById("ptsel");
// A real "fit" state: if pt 1 were pre-selected here, choosing pt 1 would fire
// no change event and the map would never zoom to it.
{
  // Hidden stand-in so re-picking "whole map (fit)" still fires a change event.
  const o = document.createElement("option"); o.value = "__pick__"; o.textContent = "whole map (fit)"; o.hidden = true;
  ptsel.appendChild(o);
}
{
  const o = document.createElement("option"); o.value = ""; o.textContent = "whole map (fit)";
  ptsel.appendChild(o);
}
DATA.games.forEach((g, i) => {
  const o = document.createElement("option"); o.value = i; o.textContent = "pt " + (i + 1);
  ptsel.appendChild(o);
});
ptsel.value = "";          // start fitted, on the whole-map option
function goPt(i) { markTouched(); const g = DATA.games[i]; flyTo(g.x, g.y, PT_ZOOM); ptsel.value = i; }
// manual pan/zoom leaves the chosen point, so the dropdown must stop claiming it
function detachPt() { if (ptsel.value !== "") ptsel.value = ""; }
// the select keeps showing "whole map (fit)", so put it on the hidden stand-in
// on mousedown; otherwise choosing fit while already on it fires no change event
ptsel.addEventListener("mousedown", () => { if (ptsel.value === "") ptsel.value = "__pick__"; });
function fitAll() { markTouched(); flyTo(MAPW / 2, MAPH / 2, fitScale()); ptsel.value = ""; }
ptsel.onchange = () => { if (ptsel.value === "") fitAll(); else goPt(+ptsel.value); };
document.querySelectorAll(".pnode").forEach(el => {
  el.addEventListener("click", e => { if (moved > 5) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
});
fit();

/* ---------------- mobile / touch: pan, pinch-zoom, tap ---------------- */
/* A phone gets one-finger pan, two-finger pinch, and a generous tap target on every
   path point. Mouse and wheel behaviour is untouched. minScale() keeps the zoom-out
   floor at "whole map fits", which on a small screen is well under 1x. */
function minScale(){ return Math.min(1, Math.min(vp.clientWidth / MAPW, vp.clientHeight / MAPH)); }
const coarsePointer = !!(window.matchMedia && window.matchMedia("(pointer:coarse)").matches);
let lastTouchAt = 0, pinchState = null, tapInfo = null;
function tDist(t){ return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
function tMid(t){ const r = vp.getBoundingClientRect();
  return { x:(t[0].clientX + t[1].clientX)/2 - r.left, y:(t[0].clientY + t[1].clientY)/2 - r.top }; }

// Synthetic mouse events that follow a touch would reset `moved` and turn a drag into a tap.
window.addEventListener("mousedown", e => {
  if (Date.now() - lastTouchAt < 900) e.stopPropagation();
}, true);
// iOS Safari's own page pinch-zoom would fight the map's.
vp.addEventListener("gesturestart", e => e.preventDefault());

vp.addEventListener("touchstart", e => {
  lastTouchAt = Date.now();
  touched = true;
  if (typeof detachPt === "function") detachPt();
  if (typeof cancelFly === "function") cancelFly();
  if (e.touches.length === 1) {
    const t = e.touches[0];
    drag = { x:t.clientX, y:t.clientY, tx:tx, ty:ty };
    moved = 0; pinchState = null;
    tapInfo = { x:t.clientX, y:t.clientY, at:Date.now(), target:e.target };
    vp.classList.add("dragging");
  } else if (e.touches.length === 2) {
    drag = null; tapInfo = null;
    const m = tMid(e.touches);
    pinchState = { d:tDist(e.touches) || 1, s:scale, wx:(m.x - tx)/scale, wy:(m.y - ty)/scale };
    vp.classList.add("dragging");
  }
}, { passive:true });

vp.addEventListener("touchmove", e => {
  if (e.touches.length === 1 && drag) {
    const t = e.touches[0];
    const dx = t.clientX - drag.x, dy = t.clientY - drag.y;
    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    if (moved > 6) e.preventDefault();
    tx = drag.tx + dx; ty = drag.ty + dy; apply();
  } else if (e.touches.length === 2 && pinchState) {
    e.preventDefault();
    const m = tMid(e.touches);
    const s2 = Math.max(minScale(), Math.min(MAXS, pinchState.s * (tDist(e.touches) / pinchState.d)));
    scale = s2; tx = m.x - pinchState.wx * s2; ty = m.y - pinchState.wy * s2;
    moved = Math.max(moved, 20); apply();
  }
}, { passive:false });

vp.addEventListener("touchend", e => {
  lastTouchAt = Date.now();
  if (e.touches.length === 0) {
    // A quick tap on open water zooms in a step; a tap on a point is left to its click.
    if (tapInfo && moved <= 6 && Date.now() - tapInfo.at < 350) {
      const onNode = tapInfo.target && tapInfo.target.closest && tapInfo.target.closest(".pnode");
      const r = vp.getBoundingClientRect();
      const now = Date.now(), near = Math.hypot(tapInfo.x - lastTap.x, tapInfo.y - lastTap.y) < 32;
      if (!onNode && now - lastTap.at < 320 && near) {
        const mx = tapInfo.x - r.left, my = tapInfo.y - r.top;
        zoomAt(mx, my, scale * 2); lastTap = { at:0, x:0, y:0 };
      } else if (!onNode) {
        lastTap = { at:Date.now(), x:tapInfo.x, y:tapInfo.y };
      }
    }
    drag = null; pinchState = null; tapInfo = null; vp.classList.remove("dragging");
  } else if (e.touches.length === 1) {
    pinchState = null;
    drag = { x:e.touches[0].clientX, y:e.touches[0].clientY, tx:tx, ty:ty };
  }
}, { passive:true });

if (coarsePointer) {
  const lastLegend = document.querySelector(".jm-legend span:last-child");
  if (lastLegend) lastLegend.textContent = "drag to pan \u00b7 pinch to zoom \u00b7 tap a point";
  const hint = document.querySelector("#popcard");
}
window.addEventListener("orientationchange", () => setTimeout(() => { if (!touched) fit(); }, 120));
</script></body></html>
